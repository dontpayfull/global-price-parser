[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "global-price-parser"
version = "0.1.0"
description = "Read prices and resolve currencies from international text and HTML."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "DontPayFull" }]
keywords = ["price", "currency", "parser", "html", "cldr"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://www.dontpayfull.com/labs/global-price-parser/"
Repository = "https://github.com/dontpayfull/global-price-parser"
DontPayFull = "https://www.dontpayfull.com"

[tool.hatch.build.targets.wheel]
packages = ["src/global_price_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
